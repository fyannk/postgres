name: Published image watch

# The pull request gate only fails on fixable criticals a change introduces.
# One that reaches a published image because an advisory was filed after the
# fact is tracked here instead: a single issue that opens when a fixable
# critical appears, is updated in place while it remains, and closes once the
# nightly rebuild has cleared it. Editing an issue sends no notification, so a
# finding that persists for a week costs one email, not seven.

on:
  schedule:
    # Two hours after the nightly publish, so the scan sees what it shipped.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Fixable criticals in the published images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Open, update or close the tracking issue
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_MATCH_GOLANG_ALWAYS_USE_CPE_FOR_STDLIB: "true"
          REPO: ghcr.io/${{ github.repository_owner }}/postgres
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Published images have fixable critical vulnerabilities"

          .github/scripts/fetch-upstream.sh upstream >/dev/null
          mapfile -t images < <(.github/scripts/matrix.sh upstream | jq -r '.[] | "\(.major)-\(.variant)"')

          findings=""
          for tag in "${images[@]}"; do
            if ! "${GRYPE}" -q -o json "registry:${REPO}:${tag}" > scan.json; then
              echo "::warning::Could not scan ${REPO}:${tag}"
              continue
            fi
            rows="$(jq -r --arg tag "${tag}" '[.matches[]
              | select(.vulnerability.severity == "Critical" and .vulnerability.fix.state == "fixed")
              | "| `\($tag)` | \(.vulnerability.id) | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.fix.versions | join(", ")) |"]
              | unique | .[]' scan.json)"
            if [[ -n "${rows}" ]]; then
              findings+="${rows}"$'\n'
            fi
          done

          number="$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"

          if [[ -z "${findings}" ]]; then
            if [[ -n "${number}" ]]; then
              gh issue close "${number}" --comment "Cleared: [this scan](${RUN_URL}) of \`${REPO}\` finds no fixable critical."
            fi
            echo "No fixable critical in ${REPO}."
            exit 0
          fi

          body="$(cat <<EOB
          [The nightly scan](${RUN_URL}) of \`${REPO}\` found fixable critical vulnerabilities.

          | Image | Advisory | Package | Installed | Fixed in |
          | --- | --- | --- | --- | --- |
          ${findings}

          The nightly rebuild picks up a fix on its own once the Debian, Alpine
          or PostgreSQL repositories ship it, at the latest within a week. A
          finding that survives a rebuild is usually waiting on upstream
          (docker-library/postgres or the distribution). This issue closes
          itself once a scan comes back clean.
          EOB
          )"

          if [[ -n "${number}" ]]; then
            gh issue edit "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

  # CI uploads to code scanning only on a pull request or a push, so without
  # this an advisory filed between two pushes would not show on the Security
  # tab until the next one.
  matrix:
    name: List the images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          set -euo pipefail
          .github/scripts/fetch-upstream.sh upstream >/dev/null
          echo "matrix=$(.github/scripts/matrix.sh upstream)" >> "${GITHUB_OUTPUT}"

  code-scanning:
    name: Fixable findings to code scanning (${{ matrix.image.dir }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      IMAGE: postgres-ci:${{ matrix.image.version }}-${{ matrix.image.variant }}
      GRYPE_MATCH_GOLANG_ALWAYS_USE_CPE_FOR_STDLIB: "true"
    steps:
      # Scanned under the name CI gives its build, and uploaded under CI's
      # category, so that a finding CI reported keeps its alert instead of
      # getting a second one.
      - name: Pull the published image
        env:
          PUBLISHED: ghcr.io/${{ github.repository_owner }}/postgres:${{ matrix.image.major }}-${{ matrix.image.variant }}
        run: |
          set -euo pipefail
          docker pull --quiet "${PUBLISHED}"
          docker tag "${PUBLISHED}" "${IMAGE}"

      - name: Fixable findings
        id: full
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          only-fixed: true
          output-format: sarif

      - name: Publish to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.full.outputs.sarif }}
          category: grype-${{ matrix.image.major }}-${{ matrix.image.variant }}
