name: Build and publish PostgreSQL images

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: "docker-library/postgres commit or branch to build (default: its default branch)"
        required: false
        type: string
      force:
        description: "Rebuild every image even if no input changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: postgres-image-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: postgres

jobs:
  detect:
    name: Resolve upstream
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.upstream.outputs.revision }}
      matrix: ${{ steps.upstream.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch and patch upstream
        id: upstream
        env:
          UPSTREAM_REF: ${{ inputs.upstream-ref || 'HEAD' }}
        run: |
          set -euo pipefail
          revision="$(.github/scripts/fetch-upstream.sh upstream "${UPSTREAM_REF}")"
          # Patch everything up front: if any variant no longer patches cleanly
          # nothing is published, rather than a partial set.
          .github/scripts/patch-upstream.sh upstream
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(.github/scripts/matrix.sh upstream)" >> "${GITHUB_OUTPUT}"
          echo "Building docker-library/postgres at ${revision}"

  publish:
    name: Publish ${{ matrix.image.dir }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      DIR: ${{ matrix.image.dir }}
      REPO: ghcr.io/${{ github.repository_owner }}/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Patch the upstream recipe
        env:
          UPSTREAM: ${{ needs.detect.outputs.upstream }}
        run: |
          set -euo pipefail
          .github/scripts/fetch-upstream.sh upstream "${UPSTREAM}"
          .github/scripts/patch-upstream.sh upstream "${DIR}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the image needs a rebuild
        id: decide
        env:
          BASE: ${{ matrix.image.base }}
          PRIMARY: ${{ matrix.image.version }}-${{ matrix.image.variant }}
          TAGS: ${{ matrix.image.tags }}
          FORCE: ${{ inputs.force || false }}
          # Upper bound on staleness: rebuild anyway after this long so a
          # Debian or Alpine package fix with unchanged base images still
          # gets picked up.
          MAX_IMAGE_AGE_DAYS: "7"
        run: |
          set -euo pipefail

          # Each push of a mutable tag orphans the manifest it replaced, so only
          # rebuild when an input that actually changes the image has moved:
          # upstream's recipe for this one directory, the patch applied to it,
          # or the base image.
          {
            echo "recipe=$(git -C upstream rev-parse "HEAD:${DIR}")"
            echo "patch=$(sha256sum .github/scripts/patch-upstream.sh | cut -d' ' -f1)"
            echo "base=${BASE}@$(docker buildx imagetools inspect "${BASE}" --format '{{.Manifest.Digest}}')"
          } | tee /tmp/build-inputs.txt
          fingerprint="$(sha256sum /tmp/build-inputs.txt | cut -d' ' -f1)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

          image_json="$(
            docker buildx imagetools inspect "${REPO}:${PRIMARY}" \
              --format '{{ json .Image }}' 2>/dev/null || true
          )"
          published=""
          age_days=99999
          if [[ -n "${image_json}" ]]; then
            published="$(jq -r '.config.Labels["io.fyannk.postgres.inputs"] // empty' <<<"${image_json}")"
            created="$(jq -r '.created // empty' <<<"${image_json}")"
            if [[ -n "${created}" ]]; then
              age_days=$(( ( $(date -u +%s) - $(date -u -d "${created}" +%s) ) / 86400 ))
            fi
          fi

          echo "published fingerprint: ${published:-<none>}"
          echo "current fingerprint:   ${fingerprint}"
          echo "published age:         ${age_days} day(s)"

          if [[ "${FORCE}" != "true" && "${published}" == "${fingerprint}" && "${age_days}" -lt "${MAX_IMAGE_AGE_DAYS}" ]]; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
            echo "No input changed and the published image is still fresh; skipping."
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
            echo "Rebuilding."
          fi

          {
            echo "tags<<EOF"
            for tag in ${TAGS}; do echo "${REPO}:${tag}"; done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Built and checked locally first, so a broken image is never pushed.
      # Every layer goes to a local cache that the push below builds from, so
      # what is pushed is the image that was checked, not a second build.
      - name: Build image
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: ./upstream/${{ matrix.image.dir }}
          pull: true
          load: true
          tags: postgres-publish:candidate
          cache-to: type=local,dest=/tmp/build-cache,mode=max

      - name: Image behaves like upstream, without gosu
        if: steps.decide.outputs.rebuild == 'true'
        run: .github/scripts/check-image.sh postgres-publish:candidate

      - name: Push image
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: ./upstream/${{ matrix.image.dir }}
          cache-from: type=local,src=/tmp/build-cache
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.decide.outputs.tags }}
          labels: |
            org.opencontainers.image.title=postgres
            org.opencontainers.image.description=docker-library/postgres ${{ matrix.image.version }} (${{ matrix.image.variant }}), stepping down with setpriv instead of gosu
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=fyannk
            org.opencontainers.image.version=${{ matrix.image.version }}
            org.opencontainers.image.base.name=${{ matrix.image.base }}
            io.fyannk.postgres.upstream-revision=${{ needs.detect.outputs.upstream }}
            io.fyannk.postgres.inputs=${{ steps.decide.outputs.fingerprint }}

      # A cache miss between the two builds, for example a base image pushed in
      # the minutes between them, would publish layers that were never checked.
      # Compare the uncompressed layer digests so that cannot pass silently.
      - name: Pushed image is the checked image
        if: steps.decide.outputs.rebuild == 'true'
        env:
          PRIMARY: ${{ matrix.image.version }}-${{ matrix.image.variant }}
        run: |
          set -euo pipefail
          checked="$(docker image inspect postgres-publish:candidate --format '{{json .RootFS.Layers}}' | jq -c .)"
          pushed="$(docker buildx imagetools inspect "${REPO}:${PRIMARY}" --format '{{json .Image}}' | jq -c .rootfs.diff_ids)"
          if [[ "${checked}" != "${pushed}" ]]; then
            echo "::error::${REPO}:${PRIMARY} does not have the layers check-image.sh passed; rerun the publish"
            echo "checked: ${checked}"
            echo "pushed:  ${pushed}"
            exit 1
          fi
          echo "Pushed layers match the checked candidate."

  # Prune untagged manifests that no tagged index references. Do not enable
  # delete-ghost-images: it can delete tagged release versions.
  prune:
    name: Prune orphaned GHCR manifests
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ env.IMAGE_NAME }}
          delete-untagged: true
          validate: true
