name: Build and publish PostgreSQL images

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: "docker-library/postgres commit or branch to build (default: its default branch)"
        required: false
        type: string
      force:
        description: "Rebuild every image even if no input changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: postgres-image-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: postgres

jobs:
  detect:
    name: Resolve upstream
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.upstream.outputs.revision }}
      matrix: ${{ steps.upstream.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch and patch upstream
        id: upstream
        env:
          UPSTREAM_REF: ${{ inputs.upstream-ref || 'HEAD' }}
        run: |
          set -euo pipefail
          revision="$(.github/scripts/fetch-upstream.sh upstream "${UPSTREAM_REF}")"
          # Patch everything up front: if any variant no longer patches cleanly
          # nothing is published, rather than a partial set.
          .github/scripts/patch-upstream.sh upstream
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(.github/scripts/matrix.sh upstream)" >> "${GITHUB_OUTPUT}"
          echo "Building docker-library/postgres at ${revision}"

  publish:
    name: Publish ${{ matrix.image.dir }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      DIR: ${{ matrix.image.dir }}
      REPO: ghcr.io/${{ github.repository_owner }}/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Patch the upstream recipe
        env:
          UPSTREAM: ${{ needs.detect.outputs.upstream }}
        run: |
          set -euo pipefail
          .github/scripts/fetch-upstream.sh upstream "${UPSTREAM}"
          .github/scripts/patch-upstream.sh upstream "${DIR}"

      # Base images come through Google's Docker Hub mirror, which serves the
      # same digests without counting against Docker Hub's rate limits. The
      # builder falls back to Docker Hub if the mirror fails.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the image needs a rebuild
        id: decide
        env:
          BASE: ${{ matrix.image.base }}
          PRIMARY: ${{ matrix.image.version }}-${{ matrix.image.variant }}
          TAGS: ${{ matrix.image.tags }}
          FORCE: ${{ inputs.force || false }}
          # Upper bound on staleness: rebuild anyway after this long so a
          # Debian or Alpine package fix with unchanged base images still
          # gets picked up.
          MAX_IMAGE_AGE_DAYS: "7"
        run: |
          set -euo pipefail

          # Each push of a mutable tag orphans the manifest it replaced, so only
          # rebuild when an input that actually changes the image has moved:
          # upstream's recipe for this one directory, the patch applied to it,
          # or the base image.
          # Each input is resolved on its own so a failed lookup fails the step
          # instead of leaving an empty value in the fingerprint.
          recipe="$(git -C upstream rev-parse "HEAD:${DIR}")"
          patch="$(sha256sum .github/scripts/patch-upstream.sh | cut -d' ' -f1)"
          # The base digest is read where the build pulls it from: the mirror
          # for an official image, which serves the same digest as Docker Hub,
          # with Docker Hub itself as the fallback, as the builder does.
          case "${BASE}" in
            */*) base_refs=("${BASE}") ;;
            *) base_refs=("mirror.gcr.io/library/${BASE}" "${BASE}") ;;
          esac
          base_digest=""
          for ref in "${base_refs[@]}"; do
            base_digest="$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ "${base_digest}" == sha256:* ]]; then break; fi
            echo "::warning::Could not resolve ${ref}"
            base_digest=""
          done
          if [[ -z "${base_digest}" ]]; then
            echo "::error::Could not resolve the base image ${BASE} from ${base_refs[*]}"
            exit 1
          fi
          {
            echo "recipe=${recipe}"
            echo "patch=${patch}"
            echo "base=${BASE}@${base_digest}"
          } | tee /tmp/build-inputs.txt
          fingerprint="$(sha256sum /tmp/build-inputs.txt | cut -d' ' -f1)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

          # GHCR is where images are built, checked and tagged; Docker Hub is
          # mirrored from it by the dockerhub job below.
          repos=("${REPO}")
          rebuild=false
          for target in "${repos[@]}"; do
            image_json="$(
              docker buildx imagetools inspect "${target}:${PRIMARY}" \
                --format '{{ json .Image }}' 2>/dev/null || true
            )"
            published=""
            age_days=99999
            if [[ -n "${image_json}" ]]; then
              published="$(jq -r '.config.Labels["io.fyannk.postgres.inputs"] // empty' <<<"${image_json}")"
              created="$(jq -r '.created // empty' <<<"${image_json}")"
              if [[ -n "${created}" ]]; then
                age_days=$(( ( $(date -u +%s) - $(date -u -d "${created}" +%s) ) / 86400 ))
              fi
            fi

            echo "${target}:${PRIMARY}"
            echo "  published fingerprint: ${published:-<none>}"
            echo "  current fingerprint:   ${fingerprint}"
            echo "  published age:         ${age_days} day(s)"
            if [[ "${published}" != "${fingerprint}" || "${age_days}" -ge "${MAX_IMAGE_AGE_DAYS}" ]]; then
              rebuild=true
            fi
          done

          if [[ "${FORCE}" == "true" ]]; then
            rebuild=true
          fi
          echo "rebuild=${rebuild}" >> "${GITHUB_OUTPUT}"
          if [[ "${rebuild}" == "true" ]]; then
            echo "Rebuilding."
          else
            echo "No input changed and every published image is still fresh; skipping."
          fi

          {
            echo "repos=${repos[*]}"
            names="${repos[*]}"
            echo "names=${names// /,}"
            echo "tags<<EOF"
            for target in "${repos[@]}"; do
              for tag in ${TAGS}; do echo "${target}:${tag}"; done
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Built and checked locally first, so a broken image is never pushed.
      # Every layer goes to a local cache that the push below builds from, so
      # what is pushed is the image that was checked, not a second build.
      - name: Build image
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: ./upstream/${{ matrix.image.dir }}
          pull: true
          load: true
          tags: postgres-publish:candidate
          cache-to: type=local,dest=/tmp/build-cache,mode=max

      - name: Image behaves like upstream, without gosu
        if: steps.decide.outputs.rebuild == 'true'
        run: .github/scripts/check-image.sh postgres-publish:candidate

      # Pushed by digest, without tags: nothing users pull changes until the
      # pushed image has been verified below and its digest promoted.
      - name: Push image
        id: push
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: ./upstream/${{ matrix.image.dir }}
          cache-from: type=local,src=/tmp/build-cache
          outputs: type=image,"name=${{ steps.decide.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=postgres
            org.opencontainers.image.description=docker-library/postgres ${{ matrix.image.version }} (${{ matrix.image.variant }}), stepping down with setpriv instead of gosu
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=fyannk
            org.opencontainers.image.version=${{ matrix.image.version }}
            org.opencontainers.image.base.name=${{ matrix.image.base }}
            io.fyannk.postgres.upstream-revision=${{ needs.detect.outputs.upstream }}
            io.fyannk.postgres.inputs=${{ steps.decide.outputs.fingerprint }}

      # A cache miss between the two builds, for example a base image pushed in
      # the minutes between them, would publish an image that was never
      # checked. Compare the uncompressed layers and the runtime configuration
      # (everything but the labels the push adds), so it cannot pass silently.
      # The release tags have not moved yet, so a failure here leaves users on
      # the previous image and the next run rebuilds.
      - name: Pushed image is the checked image
        if: steps.decide.outputs.rebuild == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOS: ${{ steps.decide.outputs.repos }}
        run: |
          set -euo pipefail
          runtime='{Env, Entrypoint, Cmd, User, WorkingDir, ExposedPorts, Volumes, StopSignal}
            | map_values(if . == null or . == "" or . == [] or . == {} then null else . end)'
          checked="$(docker image inspect postgres-publish:candidate --format '{{json .}}' \
            | jq -cS "{layers: .RootFS.Layers, config: (.Config | ${runtime})}")"
          for target in ${REPOS}; do
            pushed="$(docker buildx imagetools inspect "${target}@${DIGEST}" --format '{{json .Image}}' \
              | jq -cS "{layers: .rootfs.diff_ids, config: (.config | ${runtime})}")"
            if [[ "${checked}" != "${pushed}" ]]; then
              echo "::error::${target}@${DIGEST} differs from the image check-image.sh passed; no tag was moved"
              echo "checked: ${checked}"
              echo "pushed:  ${pushed}"
              exit 1
            fi
            echo "${target}@${DIGEST} matches the checked candidate."
          done

      # The tags are pointed at the verified digest itself, so what they serve
      # is exactly what was compared above, attestations included. Each
      # registry's tags are created from its own copy of that digest.
      - name: Move the release tags to the verified image
        if: steps.decide.outputs.rebuild == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOS: ${{ steps.decide.outputs.repos }}
          TAGS: ${{ steps.decide.outputs.tags }}
        run: |
          set -euo pipefail
          for target in ${REPOS}; do
            args=()
            while IFS= read -r tag; do
              [[ "${tag}" == "${target}:"* ]] && args+=(--tag "${tag}")
            done <<<"${TAGS}"
            docker buildx imagetools create "${args[@]}" "${target}@${DIGEST}"
          done
          for tag in ${TAGS}; do
            resolved="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "${resolved}" == "${DIGEST}" ]] || { echo "::error::${tag} resolves to ${resolved}, expected ${DIGEST}"; exit 1; }
            echo "${tag} -> ${DIGEST}"
          done

  # Copy what GHCR now serves to Docker Hub, from one job, so Docker Hub sees
  # a few sequential requests instead of every publish job at once (an
  # account gets 200 registry requests an hour). Runs even when some publish
  # jobs failed, to mirror the ones that succeeded; anything missed is
  # mirrored by the next run.
  dockerhub:
    name: Mirror to Docker Hub
    needs: [detect, publish]
    if: always() && needs.detect.result == 'success' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      HUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      GRACE_DAYS: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HUB_ENABLED == 'true'

      - name: Login to GHCR
        if: env.HUB_ENABLED == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HUB_ENABLED == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror the tags
        if: env.HUB_ENABLED == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/sync-dockerhub.sh "ghcr.io/${OWNER}/${IMAGE_NAME}" "${OWNER}/${IMAGE_NAME}"

      # An image the mirror replaced stays pullable by digest for a week, as
      # on GHCR. The Hub manifests API this relies on is not in Docker's
      # published reference, so a failure warns instead of failing the run.
      - name: Prune replaced images
        if: always() && env.HUB_ENABLED == 'true'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/prune-dockerhub.sh "${OWNER}/${IMAGE_NAME}" "${GRACE_DAYS}"

  # Prune untagged GHCR manifests that no tagged index references, once they
  # have been untagged for a week: an image replaced by a newer push stays
  # pullable by digest long enough for anyone pinning it to move on. Do not
  # enable delete-ghost-images: it can delete tagged release versions.
  prune:
    name: Prune replaced GHCR images
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ env.IMAGE_NAME }}
          delete-untagged: true
          older-than: 7 days
          validate: true
